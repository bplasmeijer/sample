name: Checkout Workflow

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Set up KinD cluster
      uses: helm/kind-action@v1.0.0
      with:
        version: v0.24.0  # Specify the KinD version you want to use

    - name: Verify cluster
      run: kubectl get nodes
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: loop over deployments
      run: |
        for dir in deployments/*/
        do
            echo "Building and pushing $dir"
            app=${dir#deployments/}
            app=${app%/}

            echo "Building and pushing $dir on $app"
            cp -r deployments/package/py/dockerfile deployments/$app/dockerfile

            docker build -t ${{ secrets.DOCKER_USERNAME }}/$app:latest $dir
            docker push ${{ secrets.DOCKER_USERNAME }}/$app:latest
        done

    - name: Deploy applications
      run: bash ./deploy.sh

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with: 
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Add new deployments"
        title: "deployments-${{ github.run_id }}"
        body: "This PR adds a new deployments"
        branch: "deployments-${{ github.run_id }}"
        base: "develop"
